name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  backend:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: npm ci
      - run: npm run build:functions
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply database migrations
        run: supabase db push --remote --include-all --yes
      - name: Deploy edge functions
        run: supabase functions deploy tick admin --project-ref "$PROJECT_REF" --yes
      - name: Point the scheduler at the functions
        run: |
          curl -sSf -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"query\": \"insert into public.app_config (key, value) values ('functions_url', 'https://$PROJECT_REF.supabase.co/functions/v1') on conflict (key) do update set value = excluded.value\"}"
      - name: Run the scheduler once and report status
        run: |
          sql() { curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$1" '{query: $q}')"; echo; }
          SECRET=$(sql "select value from public.app_config where key = 'cron_secret'" | jq -r '.[0].value')
          echo "::add-mask::$SECRET"
          echo "--- tick:"
          curl -sS -m 140 -X POST "https://$PROJECT_REF.supabase.co/functions/v1/tick" -H "x-pitchside-secret: $SECRET" -H "content-type: application/json" -d '{}' || true
          echo; echo "--- worlds:"
          sql "select id, name, season, season_start, clock_offset_s from public.worlds"
          echo "--- clubs:"
          sql "select count(*) from public.clubs"
          echo "--- cron jobs:"
          sql "select jobid, schedule, active from cron.job"
          echo "--- last cron runs:"
          sql "select status, return_message, start_time from cron.job_run_details order by start_time desc limit 3"
          echo "--- last http responses:"
          sql "select status_code, left(content::text, 300) as content, error_msg, created from net._http_response order by created desc limit 3"
